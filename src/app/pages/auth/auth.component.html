<div class="auth-container">
    <div style="position: absolute; top: 2rem; right: 2rem;">
        <app-language-switcher></app-language-switcher>
    </div>
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo"></div>
            <h1>{{ mode === 'login' ? ('AUTH.WELCOME' | translate) : ('AUTH.CREATE' | translate) }}</h1>
            <p>{{ 'AUTH.SUBTITLE' | translate }}</p>
        </div>

        <form class="auth-form" (submit)="$event.preventDefault(); submit()">
            <div class="form-group">
                <label>{{ 'AUTH.EMAIL' | translate }}</label>
                <input type="email" [(ngModel)]="email" name="email" class="auth-input" placeholder="name@company.com" required />
            </div>

            <div class="form-group">
                <label>{{ 'AUTH.PASSWORD' | translate }}</label>
                <input type="password" [(ngModel)]="password" name="password" class="auth-input" placeholder="••••••••" required />
            </div>

            @if (error) {
            <div
                style="color: #ef4444; font-size: 0.875rem; background: #fef2f2; padding: 0.75rem; border-radius: 8px; border: 1px solid #fecaca;">
                {{ error }}
            </div>
            }

            <button type="submit" class="btn primary"
                style="padding: 0.875rem; font-size: 1rem; border-radius: 12px; margin-top: 0.5rem;">
                {{ mode === 'login' ? ('AUTH.SIGN_IN_BTN' | translate) : ('AUTH.CREATE_BTN' | translate) }}
            </button>
        </form>

        <div class="auth-footer">
            <a (click)="toggleMode()" style="cursor: pointer; display: inline-block;">
                {{ mode === 'login' ? ('AUTH.NO_ACCOUNT' | translate) : ('AUTH.HAS_ACCOUNT' | translate) }}
            </a>
            <div style="margin-top: 0.5rem;">
                <a routerLink="/" style="cursor: pointer; color: #94a3b8; font-size: 0.85rem; font-weight: 500;">&larr;
                    {{ 'AUTH.BACK' | translate }}</a>
            </div>
        </div>
    </div>
</div>
