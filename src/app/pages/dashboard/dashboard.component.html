<div class="card">
  <div class="header-row" style="display:flex;justify-content:space-between;align-items:center">
    <div>
      <div class="page-title"><mat-icon class="page-title-icon" aria-hidden="true">space_dashboard</mat-icon>Dashboard
      </div>
      <div class="muted">Overview and quick actions</div>
    </div>
    <div class="controls">
      <button class="btn primary pill" routerLink="/schedules">New Schedule</button>
    </div>
  </div>

  <div class="dashboard-grid">
    <a class="card stat-card" routerLink="/teams">
      <div class="stat-icon primary">
        <mat-icon>groups</mat-icon>
      </div>
      <div class="stat-content">
        <div class="stat-value">{{ teamsCount }}</div>
        <div class="stat-label">Active Teams</div>
      </div>
    </a>

    <a class="card stat-card" routerLink="/employees">
      <div class="stat-icon success">
        <mat-icon>person</mat-icon>
      </div>
      <div class="stat-content">
        <div class="stat-value">{{ employeesCount }}</div>
        <div class="stat-label">Staff Members</div>
      </div>
    </a>

    <a class="card stat-card" routerLink="/shifts">
      <div class="stat-icon warning">
        <mat-icon>work_history</mat-icon>
      </div>
      <div class="stat-content">
        <div class="stat-value">{{ shiftTypesCount }}</div>
        <div class="stat-label">Shift Definitions</div>
      </div>
    </a>
  </div>
</div>
