<div class="card">
  <div class="header-row">
    <div class="header-title">
      <div class="page-title"><mat-icon class="page-title-icon" aria-hidden="true">people_alt</mat-icon>{{ 'TEAMS.TITLE' | translate }}</div>
      <div class="muted">{{ 'TEAMS.SUBTITLE' | translate }}</div>
    </div>
    <div class="controls" style="margin-top: 1rem;">
      <button class="btn pill primary" (click)="addNew()">
        <mat-icon>add</mat-icon>{{ 'TEAMS.ADD' | translate }}
      </button>
    </div>
  </div>

  <div class="team-grid">
    @for (team of teams; track $index) {
    <div class="card team-card">
      @if (!team._editing) {
      <div class="card-content">
        <div style="display: flex; align-items: flex-start; justify-content: space-between; width: 100%;">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <div class="avatar" style="background: rgba(79, 70, 229, 0.1); color: var(--primary); border: none;">
                    <mat-icon>groups</mat-icon>
                </div>
                <div>
                    <div style="font-weight:800;font-size:1.1rem">{{ team.name }}</div>
                    <div class="muted" style="font-size:0.9rem">Internal Team</div>
                </div>
            </div>
            <button class="btn btn-icon danger" (click)="confirmRemove(team)" title="{{ 'TEAMS.DELETE' | translate }}">
                <mat-icon>delete</mat-icon>
            </button>
        </div>
        <div class="controls">
            <button class="btn pill" (click)="edit(team)">
                <mat-icon>edit</mat-icon>{{ 'TEAMS.EDIT' | translate }}
            </button>
            <button class="btn pill" [routerLink]="['/teams', team.id]">
                <mat-icon>open_in_new</mat-icon>{{ 'TEAMS.OPEN' | translate }}
            </button>
        </div>
      </div>
      }
      @if (team._editing) {
      <div class="edit-controls">
          <input class="input" [(ngModel)]="team.name" [placeholder]="'TEAMS.NAME' | translate" />
          <div class="controls">
              <button class="btn pill primary" [disabled]="!team.name" (click)="save(team)">
                <mat-icon>save</mat-icon>{{ 'TEAMS.SAVE' | translate }}
              </button>
              <button class="btn pill" (click)="cancelEdit(team)">
                <mat-icon>close</mat-icon>{{ 'TEAMS.CANCEL' | translate }}
              </button>
          </div>
      </div>
      }
    </div>
    }
  </div>

  <app-confirm [visible]="confirmState.visible" [title]="confirmState.title" [message]="confirmState.message"
    [confirmLabel]="confirmState.confirmLabel ?? null" [cancelLabel]="confirmState.cancelLabel ?? null"
    (confirmed)="onConfirmedRemove()" (cancelled)="onCancelledRemove()"></app-confirm>
</div>
