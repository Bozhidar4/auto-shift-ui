<div class="card">
  <div class="header-row">
    <div class="header-title">
      <div class="page-title"><mat-icon class="page-title-icon" aria-hidden="true">people_alt</mat-icon>Teams</div>
      <div class="muted">Manage teams and their settings</div>
    </div>
    <div class="controls" style="margin-top: 1rem;">
      <button class="btn pill primary" (click)="addNew()">
        <mat-icon>add</mat-icon>Add Team
      </button>
    </div>
  </div>

  <div class="team-grid" style="margin-top:1.5rem">
    @for (team of teams; track $index) {
    <div class="card team-card">
      @if (!team._editing) {
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="display: flex; align-items: center; gap: 1rem;">
            <div class="avatar" style="background: rgba(79, 70, 229, 0.1); color: var(--primary); border: none;">
                <mat-icon>groups</mat-icon>
            </div>
            <div>
                <div style="font-weight:800;font-size:1.1rem">{{ team.name }}</div>
                <div class="muted" style="font-size:0.9rem">Internal Team</div>
            </div>
        </div>
        <div class="controls">
            <button class="btn pill" (click)="edit(team)">
                <mat-icon>edit</mat-icon>Edit
            </button>
            <button class="btn pill" [routerLink]="['/teams', team.id]">
                <mat-icon>open_in_new</mat-icon>Open
            </button>
            <button class="btn pill danger" (click)="confirmRemove(team)">
                <mat-icon>delete</mat-icon>Delete
            </button>
        </div>
      </div>
      }
      @if (team._editing) {
      <div class="controls">
          <input class="input" [(ngModel)]="team.name" placeholder="Team name" />
          <button class="btn pill primary" [disabled]="!team.name" (click)="save(team)">
            <mat-icon>save</mat-icon>Save
          </button>
          <button class="btn pill" (click)="cancelEdit(team)">
            <mat-icon>close</mat-icon>Cancel
          </button>
      </div>
      }
    </div>
    }
  </div>

  <app-confirm [visible]="confirmState.visible" [title]="confirmState.title" [message]="confirmState.message"
    [confirmLabel]="confirmState.confirmLabel ?? null" [cancelLabel]="confirmState.cancelLabel ?? null"
    (confirmed)="onConfirmedRemove()" (cancelled)="onCancelledRemove()"></app-confirm>
</div>
