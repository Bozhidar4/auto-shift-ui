@if (visible) {
<div class="confirm-overlay">
    <div class="confirm-card card">
        <div class="confirm-title">{{ title || ('COMMON.CONFIRM' | translate) }}</div>
        <div class="confirm-message">{{ message }}</div>
        <div class="confirm-actions">
            <button class="btn pill" (click)="onCancel()">{{ cancelLabel || ('COMMON.CANCEL' | translate) }}</button>
            <button class="btn danger pill" (click)="onConfirm()">{{ confirmLabel || ('COMMON.DELETE' | translate) }}</button>
        </div>
    </div>
</div>
}
